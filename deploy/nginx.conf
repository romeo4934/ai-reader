# book.getlydi.com — reverse proxy in front of ai-reader.
# Installed to /etc/nginx/sites-available/ai-reader.conf and symlinked into
# sites-enabled. Single instance behind nginx (no blue/green slots) —
# ai-reader listens on 127.0.0.1:8091 only, nginx is the public edge.

server {
    listen 80;
    listen [::]:80;
    server_name book.getlydi.com;

    # Certbot renewals must keep working over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://book.getlydi.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name book.getlydi.com;

    ssl_certificate     /etc/letsencrypt/live/book.getlydi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/book.getlydi.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # An uploaded epub is the largest thing this ever accepts.
    client_max_body_size 30m;

    access_log /var/log/nginx/ai-reader.access.log;
    error_log  /var/log/nginx/ai-reader.error.log;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # nginx terminates TLS here, so $scheme is the truth regardless of what
        # Cloudflare forwarded. The app uses it to mark its cookie Secure.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Probes stay local: no reason to expose them to the internet.
    location = /ready {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8091;
    }
}
