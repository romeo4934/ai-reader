<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lydi</title>
<style>
  :root { --bg: #fbfaf7; --fg: #1d1d1f; --muted: #6b6b70; --accent: #2f6f4f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17181a; --fg: #ececec; --muted: #9a9a9e; --accent: #4fa877; } }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: Georgia, serif; text-align: center; padding: 1.5rem; box-sizing: border-box; }
  .mark { display: inline-grid; place-items: center; width: 3.5rem; height: 3.5rem; border-radius: 0.9rem; background: #2f6f4f; color: #fff; font-style: italic; font-weight: 700; font-size: 2.2rem; }
  p { line-height: 1.5; max-width: 22rem; margin: 1rem auto; }
  .muted { color: var(--muted); font-size: 0.95rem; }
  button { font: inherit; font-family: sans-serif; padding: 0.7rem 1.4rem; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <div class="mark">L</div>
    <p><strong>Pas de connexion internet.</strong><br>Lydi a besoin du réseau pour traduire.</p>
    <p class="muted">No internet connection · Sin conexión · Sem ligação · Nessuna connessione · Keine Verbindung · Geen verbinding</p>
    <button onclick="location.reload()">↻</button>
  </main>
</body>
</html>
