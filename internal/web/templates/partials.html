{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
{{end}}

{{define "nav"}}
<nav class="topnav">
  <a href="/" class="brand" aria-label="Lydi"><span class="brand-mark" aria-hidden="true">L</span><span class="brand-name">Lydi</span></a>
  <input type="checkbox" id="nav-toggle" class="nav-toggle-checkbox">
  <label for="nav-toggle" class="nav-toggle-btn" aria-label="Menu">☰</label>
  <div class="nav-links">
    {{if .LoggedIn}}
      <a href="/words">{{.T.NavMyWords}}</a>
      <a href="/review">{{.T.NavReview}}{{if gt .DueCount 0}} <span class="badge">{{.DueCount}}</span>{{end}}</a>
      <a href="/reviewed">{{.T.NavHistory}}</a>
      <a href="/settings">{{.T.NavSettings}}</a>
    {{else}}
      <a href="/login">{{.T.NavLogin}}</a>
    {{end}}
  </div>
</nav>
{{end}}

{{define "confirmDelete"}}
<script>
  document.querySelectorAll('form.confirm-delete').forEach(function (f) {
    f.addEventListener('submit', function (e) {
      if (!confirm(f.dataset.confirm)) e.preventDefault();
    });
  });
</script>
{{end}}
