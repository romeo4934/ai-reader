<!doctype html>
<html lang="{{.T.LangCode}}">
<head>
  <title>{{.Title}}</title>
  {{template "head" .}}
</head>
<body>
  {{template "nav" .}}

  <main class="page">
    <h1>{{.T.SettingsTitle}}</h1>

    <form action="/settings" method="post" class="settings-form">
      <label for="native_lang_select">{{.T.SettingsNativeLangLabel}}</label>
      <select id="native_lang_select">
        <option value="français">Français</option>
        <option value="english">English</option>
        <option value="español">Español</option>
        <option value="português do Brasil">Português (Brésil)</option>
        <option value="português de Portugal">Português (Portugal)</option>
        <option value="italiano">Italiano</option>
        <option value="deutsch">Deutsch</option>
        <option value="nederlands">Nederlands</option>
        <option value="__other__">{{.T.SettingsOther}}</option>
      </select>
      <input type="text" id="native_lang" name="native_lang" value="{{.Data.NativeLang}}" required hidden>
      <p class="hint">{{.T.SettingsNativeLangHint}}</p>
      <button type="submit" class="btn btn-primary">{{.T.SettingsSave}}</button>
    </form>

    <script>
      (function () {
        var select = document.getElementById('native_lang_select');
        var input = document.getElementById('native_lang');
        var current = input.value.trim().toLowerCase();
        var matched = false;
        for (var i = 0; i < select.options.length; i++) {
          if (select.options[i].value.toLowerCase() === current) {
            select.value = select.options[i].value;
            matched = true;
            break;
          }
        }
        function sync() {
          if (select.value === '__other__') {
            input.hidden = false;
            input.value = matched ? '' : input.value;
          } else {
            input.hidden = true;
            input.value = select.value;
          }
        }
        if (!matched) {
          select.value = '__other__';
        }
        sync();
        select.addEventListener('change', sync);
      })();
    </script>

    <p class="hint" style="margin-top:2rem">{{.T.SettingsLoggedInAs}} <strong>{{.Data.Username}}</strong>.
      <form action="/logout" method="post" style="display:inline">
        <button type="submit" class="btn-link">{{.T.SettingsLogout}}</button>
      </form>
    </p>
  </main>
</body>
</html>
