<!doctype html>
<html lang="{{.T.LangCode}}">
<head>
  <title>{{.Title}}</title>
  {{template "head" .}}
</head>
<body>
  {{template "nav" .}}

  <main class="page reader-page">
    <header class="reader-head">
      <a href="/">{{.T.ReaderBack}}</a>
      <h1>{{.Data.Book.Title}}</h1>
      <span class="chapter-label">{{.Data.Chapter.Title}}</span>
    </header>

    <div id="chapter-viewport" class="chapter-viewport">
      <article id="chapter" class="chapter"
        data-book-id="{{.Data.Book.ID}}"
        data-chapter-id="{{.Data.Chapter.ID}}">
        {{range .Data.Paragraphs}}
        <p class="para">{{.}}</p>
        {{end}}
      </article>
    </div>

    <nav class="chapter-nav">
      {{if .Data.HasPrev}}
        <a href="/books/{{.Data.Book.ID}}?ch={{sub .Data.ChapterIdx 1}}&enter=end" id="page-prev" class="btn">{{.T.ReaderPrev}}</a>
      {{else}}
        <button type="button" id="page-prev" class="btn">{{.T.ReaderPrev}}</button>
      {{end}}
      <span id="page-indicator" class="page-indicator"></span>
      {{if .Data.HasNext}}
        <a href="/books/{{.Data.Book.ID}}?ch={{add .Data.ChapterIdx 1}}" id="page-next" class="btn">{{.T.ReaderNext}}</a>
      {{else}}
        <button type="button" id="page-next" class="btn">{{.T.ReaderNext}}</button>
      {{end}}
    </nav>
  </main>

  <div id="translate-popover" class="popover" hidden>
    <div id="tp-loading" class="tp-loading" hidden>{{.T.ReaderTranslating}}</div>
    <div id="tp-error" class="tp-error" hidden></div>
    <div class="tp-sentence" id="tp-sentence" hidden></div>
    <button id="tp-close" type="button" class="tp-close" aria-label="{{.T.ReaderClose}}">×</button>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
