<!doctype html>
<html lang="{{.T.LangCode}}">
<head>
  <title>{{.Title}}</title>
  {{template "head" .}}
</head>
<body>
  {{template "nav" .}}

  <main class="page">
    <h1>{{.T.WordsTitle}}</h1>

    {{if not .Data}}
      <p class="empty">{{.T.WordsEmpty}}</p>
    {{else}}
      {{$t := .T}}
      <ul class="word-list">
        {{range .Data}}
        <li>
          <details>
            <summary class="word-row">
              <span class="word-phrase">{{if .Lemma}}{{.Lemma}}{{else}}{{.Phrase}}{{end}}</span>
              <span class="word-translation">{{.Translation}}</span>
            </summary>
            <p class="word-context">{{highlight .Context .Phrase}}</p>
            <form action="/words/{{.ID}}/archive" method="post">
              <button type="submit" class="btn-link">{{$t.WordsKnowIt}}</button>
            </form>
          </details>
        </li>
        {{end}}
      </ul>
    {{end}}
  </main>
</body>
</html>
