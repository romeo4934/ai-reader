<!doctype html>
<html lang="{{.T.LangCode}}"{{if .Theme}} data-theme="{{.Theme}}"{{end}}>
<head>
  <title>{{.Title}}</title>
  {{template "head" .}}
</head>
<body>
  {{template "nav" .}}

  <main class="page auth-page">
    <h1>{{.T.AuthSignupTitle}}</h1>
    <p class="hint">{{.Data.FreeNote}}</p>

    {{if .Data.Error}}<p class="form-error">{{.Data.Error}}</p>{{end}}

    <form action="/signup" method="post" class="settings-form">
      <label for="email">{{.T.AuthEmail}}</label>
      <input type="email" id="email" name="email" value="{{.Data.Email}}" autocomplete="email" autocapitalize="none" spellcheck="false" required autofocus>
      <label for="password">{{.T.AuthPassword}}</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
      <p class="hint">{{.T.AuthPasswordHint}}</p>
      <button type="submit" class="btn btn-primary">{{.T.AuthSignupBtn}}</button>
    </form>

    <p class="hint auth-links">{{.T.AuthHaveAccount}} <a href="/login">{{.T.AuthLoginLink}}</a></p>
  </main>
</body>
</html>
