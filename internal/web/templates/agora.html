<!doctype html>
<html lang="{{.T.LangCode}}"{{if .Theme}} data-theme="{{.Theme}}"{{end}}{{if .Eink}} data-eink{{end}}>
<head>
  <title>{{.Title}}</title>
  {{template "head" .}}
</head>
<body class="agora-body">
  {{template "nav" .}}
  {{$t := .T}}{{$d := .Data}}
  <main class="agora-page">
    <figure class="agora-scene">
      <canvas id="agora-game" aria-label="{{.T.AgoraTitle}}"
        data-guard="{{.T.AgoraGuard}}" data-hello="χαῖρε !" data-guard-name="{{.T.AgoraGuardName}}"
        data-days="{{.T.AgoraDays}}" data-speech="{{.T.AgoraSpeech}}" data-ranks="{{.T.AgoraRank1}}|{{.T.AgoraRank2}}|{{.T.AgoraRank3}}|{{.T.AgoraRank4}}" data-threshold="{{$d.Threshold}}"></canvas>

      <div class="agora-hud">
        <button type="button" class="agora-pill" data-open="{{if $d.Visitor}}panel-intro{{else}}panel-registry{{end}}">🏛️ {{if $d.Visitor}}{{printf $t.AgoraVisitorCount $d.MemberCount}}{{else if $d.Member}}{{$d.Rank}} · {{printf $t.AgoraDays $d.Days}}{{else}}Agora · {{$d.Days}} / {{$d.Threshold}}{{end}}</button>
        <span class="agora-hud-gap"></span>
        <button type="button" class="agora-round" data-zoom="0.8" aria-label="−">−</button>
        <button type="button" class="agora-round" data-zoom="1.25" aria-label="+">+</button>
        {{if not $d.Visitor}}<button type="button" class="agora-round" data-open="panel-look" aria-label="{{.T.LookTitle}}">🎨</button>{{end}}
        <button type="button" class="agora-round" data-open="panel-intro" aria-label="{{.T.AgoraTitle}}">?</button>
      </div>
      <p class="agora-hint" id="agora-hint">{{if $d.Visitor}}{{.T.AgoraVisitorHint}}{{else}}{{.T.AgoraHowTo}}{{end}}</p>

      <!-- the story, and where the reader stands -->
      <div class="agora-panel" id="panel-intro" role="dialog" aria-labelledby="intro-title"{{if not $d.Welcome}} data-once="agora-intro-seen"{{end}} hidden>
        <h1 id="intro-title">🏛️ {{.T.AgoraTitle}}</h1>
        {{if $d.Welcome}}<p class="agora-welcome">{{$d.Welcome}}</p>{{end}}
        <p>{{.T.AgoraIntro}}</p>
        {{if $d.Visitor}}
        <p><strong>{{.T.AgoraVisitorPitch}}</strong></p>
        <a href="/signup" class="btn btn-primary agora-enter">{{.T.AgoraVisitorJoin}}</a>
        <p class="agora-visitor-login"><a href="/login">{{.T.NavLogin}}</a> · <button type="button" class="btn-link" data-close>{{.T.AgoraEnter}}</button></p>
        {{else}}
        <div class="agora-status">
          <span class="agora-chip agora-chip-big" style="background: {{$d.MyColor}}">{{if $d.MySymbol}}{{$d.MySymbol}}{{else}}{{$d.MyInitial}}{{end}}</span>
          <div>
            {{if $d.Member}}
              <strong>{{$d.Rank}}</strong> · {{printf $t.AgoraDays $d.Days}}
              {{if $d.NextRank}}<p class="hint">{{printf $t.AgoraNextRank $d.NextRank $d.NextDays}}</p>{{end}}
            {{else}}
              <strong>{{printf $t.AgoraYouOut $d.Left}}</strong>
              <div class="daily-bar agora-bar"><div class="daily-bar-fill" style="width: {{$d.Percent}}%"></div></div>
            {{end}}
          </div>
        </div>
        <button type="button" class="btn btn-primary agora-enter" data-close>{{.T.AgoraEnter}}</button>
        {{end}}
        <p class="hint agora-credits"><a href="/credits">{{.T.CreditsLink}}</a> · sprites LPC</p>
      </div>

      {{if not $d.Visitor}}
      <!-- the registry: who's in, who's at the gates -->
      <div class="agora-panel" id="panel-registry" role="dialog" aria-labelledby="registry-title" hidden>
        <button type="button" class="agora-close" data-close aria-label="{{.T.ReaderClose}}">×</button>
        <h2 id="registry-title">{{.T.AgoraMembers}}</h2>
        {{if not $d.Members}}<p class="hint">{{.T.AgoraEmptyIn}}</p>{{else}}
        <ul class="agora-list">
          {{range $d.Members}}<li{{if .You}} class="agora-you"{{end}}><span class="agora-chip" style="background: {{.Medal.Color}}">{{.Medal.Symbol}}</span><span class="agora-name">{{.Name}}</span><span class="agora-rank">{{.Rank}}{{if .Medal.Laurel}} 🌿{{end}}</span><span class="hint">{{printf $t.AgoraDays .Days}}</span></li>{{end}}
        </ul>{{end}}
        <h2>{{.T.AgoraGates}}</h2>
        {{if not $d.Gates}}<p class="hint">{{.T.AgoraEmptyOut}}</p>{{else}}
        <ul class="agora-list">
          {{range $d.Gates}}<li{{if .You}} class="agora-you"{{end}}><span class="agora-chip" style="background: {{.Medal.Color}}">{{.Medal.Symbol}}</span><span class="agora-name">{{.Name}}</span><span class="agora-gate"><span class="daily-bar"><span class="daily-bar-fill" style="width: {{.Percent}}%"></span></span></span><span class="hint">{{.Days}} / {{$d.Threshold}}</span></li>{{end}}
        </ul>{{end}}
      </div>

      <!-- the character: face, outfit (some of it unlocked by rank), medallion -->
      <div class="agora-panel agora-panel-wide" id="panel-look" role="dialog" aria-labelledby="look-title" hidden>
        <button type="button" class="agora-close" data-close aria-label="{{.T.ReaderClose}}">×</button>
        <h2 id="look-title">{{.T.LookTitle}}</h2>
        {{$e := $d.Editor}}
        <form action="/agora/look" method="post" class="agora-avatar" id="look-form">
          <canvas id="look-preview" class="look-preview" width="160" height="200" aria-hidden="true"></canvas>
          <h3>{{.T.LookFace}}</h3>
          <p class="hint">{{.T.LookBody}}</p>
          <div class="look-tiles">{{range $e.Bodies}}<label><input type="radio" name="body" value="{{.Value}}"{{if eq .Value (printf "%d" $e.Look.Body)}} checked{{end}}><span class="look-tile"><canvas class="look-thumb" data-field="body" data-value="{{.Value}}" data-zoom="body"></canvas></span></label>{{end}}</div>
          <p class="hint">{{.T.LookSkin}}</p>
          <div class="agora-picks">{{range $e.Skins}}<label><input type="radio" name="skin" value="{{.Value}}"{{if eq .Value (printf "%d" $e.Look.Skin)}} checked{{end}}><span class="agora-swatch" style="background: {{.Hex}}"></span></label>{{end}}</div>
          <p class="hint">{{.T.LookHair}}</p>
          <div class="look-tiles">{{range $e.HairStyles}}<label><input type="radio" name="hair" value="{{.Value}}"{{if eq .Value (printf "%d" $e.Look.Hair)}} checked{{end}}><span class="look-tile"><canvas class="look-thumb" data-field="hair" data-value="{{.Value}}" data-zoom="head"></canvas><em>{{.Label}}</em></span></label>{{end}}</div>
          <p class="hint">{{.T.LookHairColor}}</p>
          <div class="agora-picks">{{range $e.HairColors}}<label><input type="radio" name="haircolor" value="{{.Value}}"{{if eq .Value (printf "%d" $e.Look.HairColor)}} checked{{end}}><span class="agora-swatch" style="background: {{.Hex}}"></span></label>{{end}}</div>
          <p class="hint">{{.T.LookBeard}}</p>
          <div class="look-tiles">{{range $e.Beards}}<label><input type="radio" name="beard" value="{{.Value}}"{{if eq .Value (printf "%d" $e.Look.Beard)}} checked{{end}}><span class="look-tile"><canvas class="look-thumb" data-field="beard" data-value="{{.Value}}" data-zoom="head"></canvas><em>{{.Label}}</em></span></label>{{end}}</div>

          <h3>{{.T.LookOutfit}}</h3>
          <p class="hint">{{.T.LookTunic}}</p>
          <div class="look-tiles">{{range $e.Tunics}}<label{{if .Locked}} class="locked" title="{{printf $t.LookLocked .Need}}"{{end}}><input type="radio" name="tunic" value="{{.Value}}"{{if eq .Value $e.Look.Tunic}} checked{{end}}{{if .Locked}} disabled{{end}}><span class="look-tile"><canvas class="look-thumb" data-field="tunic" data-value="{{.Value}}" data-zoom="body"></canvas>{{if .Locked}}<b class="look-lock">🔒 {{.Need}}</b>{{end}}</span></label>{{end}}</div>
          <p class="hint">{{.T.LookCape}}</p>
          <div class="look-tiles">{{range $e.Capes}}<label{{if .Locked}} class="locked" title="{{printf $t.LookLocked .Need}}"{{end}}><input type="radio" name="cape" value="{{.Value}}"{{if eq .Value $e.Look.Cape}} checked{{end}}{{if .Locked}} disabled{{end}}><span class="look-tile"><canvas class="look-thumb" data-field="cape" data-value="{{.Value}}" data-zoom="body"></canvas><em>{{.Label}}</em>{{if .Locked}}<b class="look-lock">🔒 {{.Need}}</b>{{end}}</span></label>{{end}}</div>
          <p class="hint">{{.T.LookHead}}</p>
          <div class="look-tiles">{{range $e.Heads}}<label{{if .Locked}} class="locked" title="{{printf $t.LookLocked .Need}}"{{end}}><input type="radio" name="head" value="{{.Value}}"{{if eq .Value $e.Look.Head}} checked{{end}}{{if .Locked}} disabled{{end}}><span class="look-tile"><canvas class="look-thumb" data-field="head" data-value="{{.Value}}" data-zoom="head"></canvas><em>{{.Label}}</em>{{if .Locked}}<b class="look-lock">🔒 {{.Need}}</b>{{end}}</span></label>{{end}}</div>
          <p class="hint look-unlock">{{.T.LookUnlockHint}}</p>

          <h3>{{.T.AgoraAvatarTitle}}</h3>
          <div class="agora-picks">
            <label><input type="radio" name="symbol" value=""{{if not $d.MySymbol}} checked{{end}}><span>{{$d.MyInitial}}</span></label>
            {{range $d.Symbols}}<label><input type="radio" name="symbol" value="{{.}}"{{if eq . $d.MySymbol}} checked{{end}}><span>{{.}}</span></label>{{end}}
          </div>
          <button type="submit" class="btn btn-primary">{{.T.AgoraAvatarSave}}</button>
        </form>
        <script type="application/json" id="look-palettes">{{$e.Palettes}}</script>
      </div>
      {{end}}
    </figure>
    <script type="application/json" id="agora-people">{{$d.People}}</script>
  </main>
  <script>
    // Parchment panels over the game: one open at a time. The story opens
    // by itself on a first visit (and on the day of entering the Agora).
    (function () {
      var panels = document.querySelectorAll('.agora-panel');
      function close() { panels.forEach(function (p) { p.hidden = true; }); }
      function open(id) { close(); document.getElementById(id).hidden = false; }
      document.querySelectorAll('[data-open]').forEach(function (b) {
        b.addEventListener('click', function () { open(b.dataset.open); });
      });
      document.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', close); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
      var intro = document.getElementById('panel-intro'), seen = false;
      try { seen = intro.dataset.once && localStorage.getItem(intro.dataset.once); } catch (e) {}
      if (!seen) {
        open('panel-intro');
        try { if (intro.dataset.once) localStorage.setItem(intro.dataset.once, '1'); } catch (e) {}
      }
      setTimeout(function () { var h = document.getElementById('agora-hint'); if (h) h.classList.add('agora-hint-gone'); }, 6000);
    })();
  </script>
  <script src="/static/lpc.js"></script>
  <script src="/static/agora.js"></script>
</body>
</html>
